<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="base.css">
  <title>Veterinaria La Mary</title>

  <script defer src="./login.js"></script>
</head>

<body>

  <header>
    <a href="index.html" class="logo">
      <div class="icon">
        <p>M</p>
      </div>

      <div class="marca">
        <h1>La Mary</h1>
        <h2>CLÍNICA VETERINARIA</h2>
      </div>
    </a>

    <nav class="navegacion">
      <ul>
        <li>
          <a href="./index.html">Inicio</a>
        </li>
        <li>
          <a href="./institucional.html">Institucional</a>
        </li>
        <li>
          <a href="./contacto.html">Contacto</a>
        </li>
      </ul>
    </nav>

  </header>

  <main>
    <section class="container py-5">
      <div class="row g-4 justify-content-center align-items-center">

        <article class="col-12 col-md-6">

          <form class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4" id="form-sesion">
            <h3 class="fs-4">Iniciar Sesión</h3>

            <div>
              <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
              <input type="text" name="nombreUsuario" id="nombreUsuario" class="form-control" required>
            </div>

            <div>
              <label for="contrasenia" class="form-label">Contraseña</label>
              <input type="password" name="contrasenia" id="contrasenia" class="form-control" required>
            </div>

            <span id="mensajeError" class="text-danger"></span>

            <button id="botonIniciarSesion" class="btn btn-primary" type="submit">Iniciar Sesión</button>
          </form>

        </article>

      </div>
    </section>
  </main>

  <footer>
    <div class="footer-marca">
      <span>La Mary</span>
      <p>
        Av. Siempre Viva 1234, Concordia, Entre Ríos.
        Lunes a sábado. Urgencias 24 h.
      </p>
    </div>

    <div class="footer-seccion">
      <span>SECCIONES</span>
      <a href="./index.html">Inicio</a>
      <a href="./institucional.html">Institucional</a>
      <a href="./contacto.html">Contacto</a>
    </div>

    <div class="footer-seccion">
      <span>SEGUINOS</span>
      <a href="#" target="_blank">Instagram</a>
      <a href="#" target="_blank">Facebook</a>
      <a href="#" target="_blank">TikTok</a>
    </div>
  </footer>


</body>

</html>
